[package]
name = "hlagg"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bincode = "1.3"
clap = { version = "4.0", features = ["derive"] }
curve25519-dalek = { version = "4.1.3", features = ["group", "serde"]}
ff = { version = "0.13.0", features = ["derive"] }
group = "0.13"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8.5"
rand_core = "0.6.4"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
toml = "0.8"
sha3 = "0.10"

[dev-dependencies]
rand = "0.8.5"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
incremental = true

[profile.test]
opt-level = 3
debug-assertions = true
incremental = true
debug = true

[[bin]]
name = "decryptor"
path = "experiments/bin/decryptor.rs"

[[bin]]
name = "aggregator"
path = "experiments/bin/aggregator.rs"

[[bin]]
name = "client"
path = "experiments/bin/client.rs"