[package]
name = "hlagg"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
ff = { version = "0.13.0", features = ["derive"] }
group = "0.13"
rand_core = "0.6.4"
sigma-rs = { git = "https://github.com/mmaker/sigma-rs.git" }

[dev-dependencies]
curve25519-dalek = { version = "4.1.3", features = ["group", "serde"]}
rand = "0.8.5"

[profile.release]
opt-level = 3
lto = "thin"
incremental = true
debug = true

[profile.test]
opt-level = 3
debug-assertions = true
incremental = true
debug = true
