[package]
name = "heli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bincode = "1.3"
bytesize = "1.3"
clap = { version = "4.0", features = ["derive"] }
curve25519-dalek = { version = "4.2.0", features = ["group", "serde", "digest"]}
group = "0.13"
merlin = "3.0"
rand = "0.8.5"
rand_core = "0.6.4"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
toml = "0.8"
sha3 = "0.10"
subtle = "2.6.1"
tari_bulletproofs_plus = "0.4.1"

[dev-dependencies]
aes = "0.8.4"
generic-array = "0.14"
rand = "0.8.5"
criterion = "0.6"
itertools = "0.14.0"

[profile.release]
opt-level = 3
lto = "thin"
incremental = true

[profile.test]
opt-level = 3
debug-assertions = true
incremental = true
debug = true

[[bench]]
name = "aggregation"
harness = false

[[bench]]
name = "dropout"
harness = false

[[bench]]
name = "provers"
harness = false

[[bin]]
name = "verify-bench"
path = "benches/bin/verify_bench.rs"

[[bin]]
name = "size-bench"
path = "benches/bin/size_bench.rs"

